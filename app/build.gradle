plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}
group = 'ca.qc.bdeb.sim'
repositories {
    mavenCentral()
}

dependencies {
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javafx {
    version = '21.0.8'
    modules = ['javafx.controls']
}

application {
    mainClass = 'ca.qc.bdeb.sim.tp1chattoupt.MainJavaFX'
}

sourceSets {
    main {
        resources {
            srcDirs = ["src/main/resources"]
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('runCmd', JavaExec) {
    group = 'application'
    description = 'Runs the command-line version of ChatTouPT.'
    mainClass = 'ca.qc.bdeb.sim.tp1chattoupt.MainCmd'
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    jvmArgs '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}
